[workspace]
resolver = "3"
members = [
    "engine",
    "demos/avbd_box",
    "demos/cube_field",
    "demos/icosphere_box",
    "demos/constraints",
]
# standalone crates with their own heavy builds (rust-gpu codegen); never
# part of normal workspace builds;
exclude = ["demos/rustgpu_triangle", "engine/gpu_physics"]

[profile.dev]
lto = false
opt-level = 0
incremental = true

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
